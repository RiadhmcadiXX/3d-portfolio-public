<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>character line-up</title>
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.187.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.187.0/examples/jsm/"
        }
      }
    </script>
    <style>
      html,
      body {
        margin: 0;
        background: #eef3fa;
      }
      canvas {
        display: block;
      }
    </style>
  </head>
  <body>
    <script type="module">
      import * as THREE from "three";
      import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";

      const q = new URLSearchParams(location.search);
      const chars = (q.get("chars") || "character-female-a").split(",");
      const clip = q.get("clip") || "idle";

      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(1200, 700);
      document.body.appendChild(renderer.domElement);

      const scene = new THREE.Scene();
      scene.background = new THREE.Color("#eef3fa");
      scene.add(new THREE.HemisphereLight(0xffffff, 0x99aabb, 1.4));
      const dl = new THREE.DirectionalLight(0xffffff, 2);
      dl.position.set(3, 5, 4);
      scene.add(dl);

      const ground = new THREE.Mesh(
        new THREE.PlaneGeometry(40, 20),
        new THREE.MeshStandardMaterial({ color: 0xdfe8f3 }),
      );
      ground.rotation.x = -Math.PI / 2;
      scene.add(ground);

      const load = new GLTFLoader();
      const mixers = [];
      chars.forEach(async (name, i) => {
        const gltf = await load.loadAsync(`/models/_ptest/${name}.glb`);
        const box = new THREE.Box3().setFromObject(gltf.scene);
        const h = box.max.y - box.min.y || 1;
        const g = new THREE.Group();
        g.scale.setScalar(1.6 / h);
        g.position.set(i * 2.2, 0, 0);
        g.add(gltf.scene);
        scene.add(g);
        if (clip !== "none") {
          const m = new THREE.AnimationMixer(gltf.scene);
          const c = gltf.animations.find((a) => a.name === clip);
          if (c) m.clipAction(c).play();
          mixers.push(m);
        }
        window.__loaded = (window.__loaded || 0) + 1;
      });

      const cam = new THREE.PerspectiveCamera(40, 1200 / 700, 0.05, 100);
      const cx = ((chars.length - 1) * 2.2) / 2;
      cam.position.set(cx, 1.0, 5.6);
      cam.lookAt(cx, 0.8, 0);

      const clock = new THREE.Clock();
      function tick() {
        const dt = clock.getDelta();
        mixers.forEach((m) => m.update(dt));
        renderer.render(scene, cam);
        if (window.__loaded === chars.length) window.__done = true;
        requestAnimationFrame(tick);
      }
      tick();
    </script>
  </body>
</html>
